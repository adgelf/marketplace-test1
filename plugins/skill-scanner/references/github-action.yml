# Drop-in GitHub Actions workflow for skill-scanner.
#
# Place this file at .github/workflows/skill-scan.yml in your skill repo.
#
# What it does on every PR:
#   1. Checks out the PR with full history
#   2. Discovers which skill directories changed vs the base branch
#   3. Runs scan_skill.py on each changed skill (safety + security)
#   4. Posts the aggregate report as a PR comment
#   5. Fails the check if any CRITICAL or HIGH finding appears in either
#      Safety or Security
#
# Required repo secret:
#   ANTHROPIC_API_KEY — for the LLM-based safety scan. If you don't want LLM
#   scanning in CI, change `--no-llm` below and remove the secret reference.

name: skill-scan

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No third-party deps — scan_skill.py uses stdlib only.

      - name: Run skill scanner
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python skill-scanner/scripts/ci_entrypoint.py \
            --base-ref origin/${{ github.base_ref }} \
            --repo-root . \
            --output skill-scan-report.md \
            --json skill-scan-findings.json
        continue-on-error: true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-scan-report
          path: |
            skill-scan-report.md
            skill-scan-findings.json

      - name: Post report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('skill-scan-report.md')) {
              core.info('No report file produced; skipping comment.');
              return;
            }
            const body = fs.readFileSync('skill-scan-report.md', 'utf8');
            // Find prior comment by marker
            const marker = '<!-- skill-scanner-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prior = comments.find(c => c.body && c.body.includes(marker));
            const fullBody = `${marker}\n\n${body}`;
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Fail check on CRITICAL/HIGH findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Skill scanner found CRITICAL or HIGH issues in Safety or Security."
          echo "See the PR comment or the skill-scan-report artifact for details."
          exit 1
